[package]
name = "borno"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
description = "Fast, allocation-conscious English grammatical inflections, casing transformations, URL slugification, and string utilities."
repository = "https://github.com/Hitarashi/borno"
readme = "README.md"
keywords = ["inflection", "casing", "pluralize", "slugify", "string-manipulation"]
categories = ["text-processing", "development-tools"]

[features]
default = ["full"]
full = [
    "casing",
    "conventions",
    "grammar",
    "slug",
    "utils",
    "builder",
    "ext",
    "regex",
]

# Fine-grained Casing Features
case-snake = []
case-screaming-snake = []
case-camel = []
case-pascal = []
case-kebab = []
case-train = []
case-title = []
case-sentence = []
case-dot = []
case-no = []
case-capital = []

casing = [
    "case-snake",
    "case-screaming-snake",
    "case-camel",
    "case-pascal",
    "case-kebab",
    "case-train",
    "case-title",
    "case-sentence",
    "case-dot",
    "case-no",
    "case-capital",
]

# Identifier and Database Conventions
conventions = ["case-snake", "case-pascal", "grammar", "util-slice"]

# English Grammatical Inflections
grammar = []
regex = ["dep:regex", "grammar"]

# URL Slugification
slug = []

# Fine-grained String Utilities
util-slice = []
util-normalize = []
util-interpolate = []
util-text = ["util-pad"]
util-truncate = []
util-mask = []
util-pad = []
util-format = []
util-bytes = []
util-duration = []

utils = [
    "util-slice",
    "util-normalize",
    "util-interpolate",
    "util-text",
    "util-truncate",
    "util-mask",
    "util-pad",
    "util-format",
    "util-bytes",
    "util-duration",
]

# Ergonomics
builder = []
ext = []

# Optional Serialization
serde = ["dep:serde"]

[dependencies]
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.154"
heck = "0.5.0"
convert_case = "0.12.0"
inflector = { package = "Inflector", version = "0.11.4" }
slug = "0.1.6"

[[bench]]
name = "cross_benchmark"
harness = false
required-features = ["serde"]
